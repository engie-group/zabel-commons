site_name: Zabel Commons

sort: name

generate:
  - commons/index.md:
    - zabel.commons
  - commons/exceptions.md:
    - zabel.commons.exceptions++
  - commons/interfaces.md:
    - zabel.commons.interfaces++
  - commons/sessions.md:
    - zabel.commons.sessions++
  - commons/utils.md:
    - zabel.commons.utils++
  - commons/servers.md:
    - zabel.commons.servers++

pages:
  - Home: index.md << ../README.md
  - API Documentation:
    - Overview: commons/index.md
    - Exceptions: commons/exceptions.md
    - Interfaces: commons/interfaces.md
    - Servers: commons/servers.md
    - Sessions: commons/sessions.md
    - Utils: commons/utils.md

theme:
  features:
    - navigation.indexes
    - content.code.copy
    - content.tabs.link
    # - navigation.tabs
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode

extra_javascript:
  - js/github-links.js
extra_css:
  - css/extra.css
  - css/github-links.css

markdown_extensions:
  - admonition            # https://squidfunk.github.io/mkdocs-material/reference/admonitions/
  - meta                  # https://www.mkdocs.org/user-guide/writing-your-docs/#meta-data
  - tables                # https://www.mkdocs.org/user-guide/writing-your-docs/#tables
  - codehilite            # https://yakworks.github.io/docmark/extensions/codehilite/
  - attr_list             # https://squidfunk.github.io/mkdocs-material/setup/extensions/python-markdown/#admonition
  - md_in_html
  - smarty
  - meta
  - def_list
  - pymdownx.superfences:
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - toc:
      permalink: true
      toc_depth: "1-4"

headers: markdown
